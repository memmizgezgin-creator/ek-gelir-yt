name: publish

# Change privacy of already uploaded videos (needs the owner's approval first).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Video ids separated by spaces, e.g. 001 002"
        required: true
      privacy:
        description: "public, unlisted or private"
        default: public

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: cd pipeline && python set_privacy.py ${{ github.event.inputs.privacy }} ${{ github.event.inputs.ids }}
      - if: always()
        run: |
          git config user.name "ek-gelir-yt bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/*/upload.json
          git commit -m "privacy: ${{ github.event.inputs.ids }} ${{ github.event.inputs.privacy }}" || true
          git pull --rebase --autostash -q origin main
          git push
