name: images-preview

# Fast check of image picks for one video: fetch, make a labeled contact sheet, commit it.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Video id, e.g. 001"
        required: true

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install pillow requests
      - run: python pipeline/images.py ${{ github.event.inputs.id }}
      - run: python pipeline/preview_assets.py ${{ github.event.inputs.id }}
      - name: Commit
        run: |
          d=out/${{ github.event.inputs.id }}
          git config user.name "ek-gelir-yt bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $d/assets-preview.jpg $d/credits.txt $d/credits.json
          git commit -m "images preview ${{ github.event.inputs.id }}" || true
          git push
