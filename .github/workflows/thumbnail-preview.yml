name: thumbnail-preview

# Make thumbnail variants for one video without rendering it; commits them for review.
# With set_on_youtube=true it also replaces the thumbnail of the already uploaded video.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Video id, e.g. 001"
        required: true
      set_on_youtube:
        description: "Also set it on the uploaded YouTube video"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install pillow requests numpy
      - name: Thumbnail
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          THUMB_REGEN: ${{ github.event.inputs.set_on_youtube == 'true' && '' || '1' }}
        run: python pipeline/thumbnail.py ${{ github.event.inputs.id }}
      - name: Set on YouTube
        if: github.event.inputs.set_on_youtube == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/set_thumbnail.py ${{ github.event.inputs.id }}
      - name: Commit
        run: |
          d=out/${{ github.event.inputs.id }}
          git config user.name "ek-gelir-yt bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $d/thumbnail.jpg $d/thumb-variants $d/costs.json
          git commit -m "thumbnail ${{ github.event.inputs.id }}" || true
          git pull --rebase -q origin main
          git push
