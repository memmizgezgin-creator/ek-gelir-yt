name: dub

# Dubbed audio tracks (YouTube multi-language audio) for an uploaded video.
# Translation by Claude (Max), voice by Kokoro, same timing, music and loudness as the original.
# Tracks are attached to the GitHub release "dubs"; add them in YouTube Studio > Languages (no API for this).
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Video id, e.g. 001"
        required: true
      langs:
        description: "Languages, space separated (es pt fr)"
        default: "es pt fr"

permissions:
  contents: write

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - run: pipeline/get_models.sh
      - name: Sentences and music
        run: |
          python pipeline/shots.py ${{ github.event.inputs.id }} sentences
          python pipeline/music.py fetch

      - name: Prompt es
        id: p_es
        run: |
          {
            echo 'text<<EOP'
            sed -e "s/{{ID}}/${{ github.event.inputs.id }}/g" -e "s/{{LANG}}/es/g" -e "s/{{LANGUAGE}}/Spanish (neutral Latin American)/g" prompts/dub-translate.md
            echo 'EOP'
          } >> "$GITHUB_OUTPUT"
          [ -f scripts/dub/${{ github.event.inputs.id }}.es.json ] && echo "have=yes" >> "$GITHUB_OUTPUT" || echo "have=no" >> "$GITHUB_OUTPUT"

      - name: Translate es (Claude, Max subscription)
        if: contains(github.event.inputs.langs, 'es') && steps.p_es.outputs.have == 'no'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.p_es.outputs.text }}
          claude_args: >-
            --model sonnet
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep"

      - name: Prompt pt
        id: p_pt
        run: |
          {
            echo 'text<<EOP'
            sed -e "s/{{ID}}/${{ github.event.inputs.id }}/g" -e "s/{{LANG}}/pt/g" -e "s/{{LANGUAGE}}/Brazilian Portuguese/g" prompts/dub-translate.md
            echo 'EOP'
          } >> "$GITHUB_OUTPUT"
          [ -f scripts/dub/${{ github.event.inputs.id }}.pt.json ] && echo "have=yes" >> "$GITHUB_OUTPUT" || echo "have=no" >> "$GITHUB_OUTPUT"

      - name: Translate pt (Claude, Max subscription)
        if: contains(github.event.inputs.langs, 'pt') && steps.p_pt.outputs.have == 'no'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.p_pt.outputs.text }}
          claude_args: >-
            --model sonnet
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep"

      - name: Prompt fr
        id: p_fr
        run: |
          {
            echo 'text<<EOP'
            sed -e "s/{{ID}}/${{ github.event.inputs.id }}/g" -e "s/{{LANG}}/fr/g" -e "s/{{LANGUAGE}}/French/g" prompts/dub-translate.md
            echo 'EOP'
          } >> "$GITHUB_OUTPUT"
          [ -f scripts/dub/${{ github.event.inputs.id }}.fr.json ] && echo "have=yes" >> "$GITHUB_OUTPUT" || echo "have=no" >> "$GITHUB_OUTPUT"

      - name: Translate fr (Claude, Max subscription)
        if: contains(github.event.inputs.langs, 'fr') && steps.p_fr.outputs.have == 'no'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.p_fr.outputs.text }}
          claude_args: >-
            --model sonnet
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep"

      - name: Save translations
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name "ek-gelir-yt bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/dub
          git commit -m "dub ${{ github.event.inputs.id }}: translations" || true
          git pull --rebase --autostash -q origin main
          git push

      - name: Dubbed tracks
        run: |
          cd pipeline
          for l in ${{ github.event.inputs.langs }}; do python dub.py ${{ github.event.inputs.id }} $l; done

      - name: Attach to release "dubs"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=out/${{ github.event.inputs.id }}/dub
          for f in $d/*.m4a; do ffmpeg -y -loglevel error -i $f -t 45 -b:a 96k ${f%.m4a}-preview.mp3; done
          gh release view dubs >/dev/null 2>&1 || gh release create dubs --title "Dubbed audio tracks" --notes "Multi-language audio tracks for YouTube Studio > Languages."
          gh release upload dubs $d/*.m4a $d/*-preview.mp3 --clobber
          cat $d/report-*.json
