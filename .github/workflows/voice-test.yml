name: voice-test

# Blind comparison of the same paragraph: Kokoro (current) vs Chatterbox Turbo on DeepInfra.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - run: pipeline/get_models.sh
      - name: Make clips
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: cd pipeline && python voice_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-test
          path: |
            out/voice-test/*.mp3
            out/voice-test/key.json
            out/voice-test/costs.json
      - name: Commit clips for review
        run: |
          mkdir -p samples/voice-test
          cp out/voice-test/*.mp3 out/voice-test/key.json out/voice-test/costs.json samples/voice-test/
          for f in samples/voice-test/*.mp3; do echo "$f $(ffprobe -v error -show_entries format=duration -of csv=p=0 $f)"; done
          git config user.name "ek-gelir-yt bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/voice-test
          git commit -m "voice test clips" || true
          git pull --rebase --autostash -q origin main
          git push
